var b2u = function(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; };
async function open_(pass){
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b2u(D.salt), iterations:150000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b2u(D.iv)}, key, b2u(D.ct));
  var html = new TextDecoder().decode(buf);
  try { localStorage.setItem("bs_pw", pass); } catch(e) {}
  try { sessionStorage.setItem("bs_pw", pass); } catch(e) {}
  document.open(); document.write(html); document.close();
}

  try { await open_(document.getElementById("p").value); }

});
